<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花牌分数记录</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>花牌分数记录</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">总记录数:</span>
                    <span class="stat-value" id="totalRecords">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">使用次数:</span>
                    <span class="stat-value" id="usedTimes">0</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="controls">
                <button class="btn btn-refresh" id="refreshBtn">
                    <span class="icon">🔄</span> 刷新数据
                </button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索玩家名称...">
                    <span class="icon">🔍</span>
                </div>
            </div>

            <div class="game-list" id="gameList">
                <!-- 游戏记录将在这里动态生成 -->
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>

            <div class="error-message" id="errorMessage" style="display: none;">
                <p>加载数据失败，请检查网络连接</p>
                <button class="btn btn-primary" id="retryBtn">重试</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
